name: Source secret guard

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tracked-source-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify guard fixtures
        run: node --test scripts/ai-guard/check-secrets.spec.js
      - name: Scan the full tracked source tree
        run: node scripts/ai-guard/check-secrets.js --all
      - name: Check current internal contracts
        run: node scripts/check-current-baseline.mjs
      - name: Check current documentation links
        run: node scripts/check-doc-links.mjs
      - name: Verify lockfile integrity rules
        run: node --test scripts/lib/lockfile-integrity.test.mjs
      - name: Check toolchain pins and lockfile integrity
        run: node scripts/check-toolchain.mjs
