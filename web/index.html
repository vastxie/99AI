<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // 首帧就按本地保存的明暗模式加上 .dark（规则同 src/utils/themeMode.ts），暗色用户打开时不先闪一下白底；
      // 读不到本地存储（隐私模式禁用）时和 themeMode.ts 一样按跟随系统处理
      ;(function () {
        var mode = null
        try {
          mode = localStorage.getItem('theme')
        } catch (error) {}
        try {
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (!dark) return
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#151517')
        } catch (error) {}
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>99Agent</title>
    <meta name="description" content="99Agent 是一个可私有化部署的多用户 AI Agent 平台。" />
    <meta name="keywords" content="AI, Agent, 智能助手, 沙箱, MCP" />

    <link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon/favicon-16x16.png" />
    <link rel="manifest" href="/icon/manifest.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#4176e6" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <div id="app"></div>
  </body>
</html>
