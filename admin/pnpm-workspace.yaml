packages:
  - .
  # 带 package.json 的扩展包自带运行时依赖，删包即随包卸载
  - src/packs/*

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true

overrides:
  braces: '>=3.0.3'
  postcss: '>=8.4.31'
  micromatch: '>=4.0.8'
  esbuild: '>=0.25.0'
  # 安全修复：同一大版本内升级到已修补版本
  axios@<1.20.0: 1.20.0
  picomatch@<2.3.2: 2.3.2
  lodash-es@<4.18.0: 4.18.1
  markdown-it@>=14.0.0 <14.3.2: 14.3.2
  uuid@>=11.0.0 <11.1.1: 11.1.1
